<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>The Builder Demo · Project 1 & Project 2</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{position:fixed;inset:0;height:100dvh;overflow:hidden;background:#f4f4f0;color:#14171d;font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}[hidden]{display:none!important}button,a{font:inherit;touch-action:manipulation}a{color:inherit;text-underline-offset:3px}button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #3a86ff;outline-offset:-4px}
.demo-header{height:60px;display:flex;align-items:center;gap:28px;padding:0 20px;background:#1d2028;color:#e7eaf0;border-bottom:1px solid #343943}.demo-brand{font-size:12px;font-weight:800;letter-spacing:.4px;white-space:nowrap}.demo-brand span{color:#ffd23f}.project-tabs{align-self:stretch;display:flex;gap:4px}.project-tabs button{position:relative;padding:8px 20px;border:0;border-bottom:3px solid transparent;background:transparent;color:#a8b0bf;text-align:left;cursor:pointer;font-weight:750;line-height:1.35;min-width:190px}.project-tabs small{display:block;font-size:10px;font-weight:400;margin-top:2px;color:#a8b0bf}.project-tabs button:hover{background:#ffffff09;color:#fff}.project-tabs button[aria-selected="true"]{color:#ffd23f;background:#ffffff06;border-bottom-color:#ffd23f}.project-tabs button[aria-selected="true"] small{color:#e7eaf0}.demo-links{display:flex;gap:20px;align-items:center;margin-left:auto;font-size:11px;white-space:nowrap}.demo-links a{text-decoration:none;color:#b8c0ce}.demo-links a:hover{text-decoration:underline;color:#fff}
main{height:calc(100dvh - 60px);position:relative}.project-panel{height:100%;position:relative;animation:reveal .16s ease-out}.project-panel:focus-visible{outline-offset:-3px}.project-panel iframe{display:block;width:100%;height:100%;border:0;background:#f4f4f0}.frame-loading{position:absolute;inset:0;z-index:1;background:#f4f4f0;display:grid;place-content:center;text-align:center;padding:24px}.frame-loading strong{font-size:20px}.frame-loading p{color:#596272;margin:8px 0}.frame-loading button{padding:10px 16px;border:2px solid #14171d;background:#ffd23f;cursor:pointer}.frame-loading a{font-size:12px}.skip-link{position:absolute;left:12px;top:-100px;z-index:10;padding:8px 12px;background:#ffd23f;color:#111}.skip-link:focus{top:6px}@keyframes reveal{from{opacity:.65}to{opacity:1}}
@media(max-width:1000px){.demo-header{gap:16px;padding:0 14px}.project-tabs button{min-width:165px;padding:8px 14px}.demo-links{gap:12px}.advanced-link{display:none}}
@media(max-width:700px){.demo-header{height:88px;padding:8px 12px 0;display:grid;grid-template-columns:1fr auto;grid-template-rows:22px 50px;gap:8px 12px}.demo-brand{font-size:10px}.demo-links{font-size:10px;grid-column:2;grid-row:1}.project-tabs{grid-column:1/-1;grid-row:2;gap:4px}.project-tabs button{flex:1;min-width:0;padding:6px 12px;font-size:12px}.project-tabs small{font-size:10px}main{height:calc(100dvh - 88px)}}
@media(prefers-reduced-motion:reduce){.project-panel{animation:none}}
</style>
</head>
<body>
<a class="skip-link" href="#demo-content">Đến nội dung demo</a>
<header class="demo-header">
 <div class="demo-brand">THE BUILDER <span>/ DEMO</span></div>
 <nav class="project-tabs" role="tablist" aria-label="Chọn project">
  <button id="project1-tab" role="tab" type="button" aria-controls="project1-panel" aria-selected="false" tabindex="-1">Project 1<small>Mô phỏng cơ chế</small></button>
  <button id="project2-tab" role="tab" type="button" aria-controls="project2-panel" aria-selected="false" tabindex="-1">Project 2<small>Website & backend thật</small></button>
 </nav>
 <nav class="demo-links" aria-label="Tài liệu demo"><a class="advanced-link" id="core-link" href="lab.html#project2" target="_blank" rel="noopener">Kiểm thử cốt lõi ↗</a><a href="https://github.com/ptrgiang/demo-single-use-token-idempotency" target="_blank" rel="noopener">Mã nguồn ↗</a></nav>
</header>
<main id="demo-content" tabindex="-1">
 <section id="project1-panel" class="project-panel" role="tabpanel" aria-labelledby="project1-tab" hidden>
  <div class="frame-loading" role="status"><strong>Project 1 · Mô phỏng</strong><p>Đang mở giao diện…</p><button type="button" hidden>Thử mở lại</button><a href="lab.html#project1" target="_blank" rel="noopener">Mở trực tiếp ↗</a></div>
  <iframe id="project1-frame" title="Project 1 · Mô phỏng single-use token và idempotency"></iframe>
 </section>
 <section id="project2-panel" class="project-panel" role="tabpanel" aria-labelledby="project2-tab" hidden>
  <div class="frame-loading" role="status"><strong>Project 2 · Website & backend</strong><p>Đang mở giao diện…</p><button type="button" hidden>Thử mở lại</button><a href="mini.html" target="_blank" rel="noopener">Mở trực tiếp ↗</a></div>
  <iframe id="project2-frame" title="Project 2 · Website người mua và terminal Worker D1 R2"></iframe>
 </section>
</main>
<script>
(() => {
 const base=new URL(location.href);base.hash='';base.search='';base.pathname=base.pathname.replace(/\/mini\/?$/,'/');
 const urls={project1:new URL('lab.html?embed=1#project1',base),project2:new URL('mini.html?embed=1',base)};
 document.getElementById('core-link').href=new URL('lab.html#project2',base).href;
 document.querySelector('.skip-link').addEventListener('click',e=>{e.preventDefault();document.getElementById('demo-content').focus();});
 const ids=['project1','project2'];
 const fromUrl=()=>ids.includes(location.hash.slice(1))?location.hash.slice(1):/\/mini\/?$/.test(location.pathname)?'project2':'project1';
 function select(id,writeHistory=false){
  for(const value of ids){const active=value===id;const tab=document.getElementById(value+'-tab');const panel=document.getElementById(value+'-panel');tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;panel.hidden=!active;}
  const frame=document.getElementById(id+'-frame');if(!frame.getAttribute('src'))frame.src=urls[id].href;
  document.title='The Builder Demo · '+(id==='project1'?'Project 1 · Mô phỏng':'Project 2 · Website & backend');
  if(writeHistory&&location.hash!=='#'+id)history.pushState(null,'','#'+id);
 }
 for(const id of ids){
  const tab=document.getElementById(id+'-tab');const frame=document.getElementById(id+'-frame');const loading=document.querySelector('#'+id+'-panel .frame-loading');
  const direct=new URL(urls[id]);direct.search='';loading.querySelector('a').href=direct.href;
  tab.addEventListener('click',()=>select(id,true));
  tab.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const next=e.key==='Home'?'project1':e.key==='End'?'project2':id==='project1'?'project2':'project1';select(next,true);document.getElementById(next+'-tab').focus();});
  function loadFailed(){loading.hidden=false;loading.querySelector('p').textContent='Không mở được giao diện. Bạn có thể thử lại hoặc mở trực tiếp.';loading.querySelector('button').hidden=false;}
  frame.addEventListener('load',()=>{if(!frame.getAttribute('src'))return;try{if(frame.contentDocument?.getElementById(id==='project1'?'request-logs':'terminal-toggle'))loading.hidden=true;else loadFailed();}catch{loadFailed();}});
  frame.addEventListener('error',loadFailed);
  loading.querySelector('button').addEventListener('click',()=>{loading.querySelector('p').textContent='Đang mở giao diện…';loading.querySelector('button').hidden=true;const retryUrl=new URL(urls[id]);retryUrl.searchParams.set('reload',String(Date.now()));frame.src=retryUrl.href;});
 }
 addEventListener('hashchange',()=>select(fromUrl()));addEventListener('popstate',()=>select(fromUrl()));
 select(fromUrl());
})();
</script>
</body>
</html>
